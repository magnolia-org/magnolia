name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.3.0)"
        required: true
        type: string
      prerelease:
        description: "Release type"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - prerelease

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows — NSIS installer
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows · NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Add node_modules/.bin to PATH
        shell: pwsh
        run: "${{ github.workspace }}\\node_modules\\.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up mpv runtime libraries
        run: node scripts/setup_runtime_libs_windows.mjs

      - name: Bump version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          # package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding UTF8
          # tauri.conf.json
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $v
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

      - name: Build (NSIS)
        run: node scripts/run_tauri.mjs build --target nsis
        env:
          SOIA_SKIP_APPLY_RUNTIME_LIBS: "1"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: magnolia-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS — DMG
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS · DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Add node_modules/.bin to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

      - name: Set up mpv runtime libraries
        run: bash scripts/setup_runtime_libs_macos.sh

      - name: Bump version
        run: |
          V="${{ inputs.version }}"
          # package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$V';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          # tauri.conf.json
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            c.version = '$V';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2) + '\n');
          "

      - name: Build (DMG)
        run: node scripts/run_tauri.mjs build --target dmg
        env:
          SOIA_SKIP_APPLY_RUNTIME_LIBS: "1"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: magnolia-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux — AppImage
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux · AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install JS dependencies
        run: npm ci

      - name: Add node_modules/.bin to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

      - name: Set up mpv runtime libraries
        run: bash scripts/setup_runtime_libs_linux.sh

      - name: Bump version
        run: |
          V="${{ inputs.version }}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$V';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            c.version = '$V';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2) + '\n');
          "

      - name: Build (AppImage)
        run: node scripts/run_tauri.mjs build --target appimage
        env:
          SOIA_SKIP_APPLY_RUNTIME_LIBS: "1"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: magnolia-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Draft GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  draft-release:
    name: Draft Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Magnolia v${{ inputs.version }}
          draft: true
          prerelease: ${{ inputs.prerelease == 'prerelease' }}
          generate_release_notes: true
          files: |
            artifacts/magnolia-windows-nsis/*.exe
            artifacts/magnolia-macos-dmg/*.dmg
            artifacts/magnolia-linux-appimage/*.AppImage
