[package]
name = "magnolia-core"
version = "0.1.0"
description = "Magnolia backend: torrent streaming, search, extensions and watch tracking"
authors = ["chair"]
license = "MIT"
repository = "https://github.com/chwair/magnolia"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
log = "0.4"

librqbit = "8.1.1"
bytes = "1"
url = "2"
axum = { version = "0.8", features = ["http2"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

reqwest = { version = "0.11", features = ["json", "blocking"] }
regex = "1.10"
rhai = { version = "1", features = ["sync", "serde"] }
urlencoding = "2.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
