[package]
name = "magnolia-tauri-app"
version = "1.2.0"
description = "Media torrent client"
authors = ["chair"]
license = "MIT"
repository = "https://github.com/chwair/magnolia"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
log = "0.4"
env_logger = "0.11"

librqbit = "8.1.1"
axum = { version = "0.8", features = ["http2"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }

reqwest = { version = "0.11", features = ["json"] }
scraper = "0.18"
async-trait = "0.1"
serde_bencode = "0.2"
regex = "1.10"
tempfile = "3"
chrono = "0.4"
urlencoding = "2.1"
dirs = "5.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
gag = "1.0"

# libmpv integration
libc = "0.2"
cfg-if = "1.0"
keepawake = "0.6.0"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1", features = [
    "NSView", "NSWindow", "NSResponder", "NSControl",
    "NSGraphics",
] }
objc2-foundation = { version = "0.3.1", features = ["NSString"] }
objc2-quartz-core = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13" }


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]

