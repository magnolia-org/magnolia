[package]
name = "magnolia-tauri-app"
version = "2.5.1"
description = "Media torrent client"
authors = ["chair"]
license = "MIT"
repository = "https://github.com/chwair/magnolia"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/magnolia-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
log = "0.4"

magnolia-core = { path = "crates/magnolia-core" }

reqwest = { version = "0.11", features = ["json", "blocking"] }
chrono = "0.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
gag = "1.0"

# libmpv integration
libc = "0.2"
cfg-if = "1.0"
keepawake = "0.6.0"
raw-window-handle = "0.6"
tauri-plugin-os = "2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1", features = [
    "NSView", "NSWindow", "NSResponder", "NSControl",
    "NSGraphics",
] }
objc2-foundation = { version = "0.3.1", features = ["NSString"] }
objc2-quartz-core = "0.3.1"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Patch librqbit to fix Windows seek_read not returning UnexpectedEof on short reads.
# Without this, initial_check SHA1-hashes every piece on Windows (minutes for large
# torrents) instead of using the is_broken fast-path that macOS/Linux get for free.
# The vendored copy also carries streaming changes marked `magnolia:` (stream look-ahead,
# several peers sharing a piece playback is blocked on, per-peer request caps while
# streaming, releasing a dead peer's pieces). Keep this section when bumping librqbit and
# port those changes over.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }

[dev-dependencies]

